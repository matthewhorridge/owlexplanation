name: Publish packages to the Maven Central Repository

# A release is published by pushing a tag whose value exactly matches the
# release version in pom.xml. A manually triggered run publishes a snapshot
# from the selected branch and rejects any version without a -SNAPSHOT suffix.
on:
  push:
    tags:
      - '5.*'
  workflow_dispatch:

# Never run two publications for the same branch or tag concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Configure Maven with the Central Portal credentials and import the GPG
      # private key used to sign the artifacts.
      - name: Set up JDK/Maven
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # Tag-triggered runs publish releases and require the tag and Maven
      # version to match. Manual runs are restricted to snapshots.
      - name: Validate project version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^5\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [[ "${project_version}" != "${GITHUB_REF_NAME}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match project version ${project_version}"
              exit 1
            fi
            if [[ "${project_version}" == *-SNAPSHOT ]]; then
              echo "A release tag cannot publish a snapshot version"
              exit 1
            fi
          elif [[ "${project_version}" != *-SNAPSHOT ]]; then
            echo "Manual publishing is restricted to snapshot versions"
            exit 1
          fi

      # The release profile creates and signs the source, Javadoc, and binary
      # artifacts, then publishes them through the Maven Central Portal.
      - name: Publish packages
        run: mvn --batch-mode --activate-profiles release clean deploy
env:
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  # These names are retained for compatibility with Maven settings even though
  # they contain a Maven Central Portal username and token, not legacy OSSRH
  # credentials.
  OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
